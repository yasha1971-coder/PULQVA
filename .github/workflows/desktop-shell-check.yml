name: desktop-shell-check

on:
  pull_request:
    paths:
      - "apps/pulqva-desktop/**"
      - ".github/workflows/desktop-shell-check.yml"
  push:
    branches: ["main"]
    paths:
      - "apps/pulqva-desktop/**"
      - ".github/workflows/desktop-shell-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.91.0 --profile minimal
          rustup default 1.91.0

      - name: Install Linux Tauri build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y             libwebkit2gtk-4.1-dev             libayatana-appindicator3-dev             librsvg2-dev             patchelf

      - name: Reject frontend-owned Internet access
        shell: bash
        run: |
          set -euo pipefail

          FRONTEND="apps/pulqva-desktop/frontend"

          if grep -R -n -E             'fetch[[:space:]]*\(|XMLHttpRequest|WebSocket|EventSource|navigator\.sendBeacon|https?://'             "$FRONTEND"; then
            echo "frontend external-network surface detected"
            exit 1
          fi

          grep -F             "connect-src ipc: http://ipc.localhost"             apps/pulqva-desktop/src-tauri/tauri.conf.json

      - name: Compile Tauri desktop shell
        shell: bash
        run: |
          cargo +1.91.0 check             --manifest-path apps/pulqva-desktop/src-tauri/Cargo.toml             --all-targets
