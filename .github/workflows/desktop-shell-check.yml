name: desktop-shell-check

on:
  pull_request:
    paths:
      - "apps/pulqva-desktop/**"
      - "sidecars/deno/**"
      - ".github/workflows/desktop-shell-check.yml"
  push:
    branches: ["main"]
    paths:
      - "apps/pulqva-desktop/**"
      - "sidecars/deno/**"
      - ".github/workflows/desktop-shell-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.91.0 --profile minimal
          rustup default 1.91.0

      - name: Install Linux Tauri build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y             libwebkit2gtk-4.1-dev             libayatana-appindicator3-dev             librsvg2-dev             patchelf

      - name: Reject frontend-owned Internet access
        shell: bash
        run: |
          set -euo pipefail

          FRONTEND="apps/pulqva-desktop/frontend"

          if grep -R -n -E             'fetch[[:space:]]*\(|XMLHttpRequest|WebSocket|EventSource|navigator\.sendBeacon|https?://'             "$FRONTEND"; then
            echo "frontend external-network surface detected"
            exit 1
          fi

          grep -F             "connect-src ipc: http://ipc.localhost"             apps/pulqva-desktop/src-tauri/tauri.conf.json

      - name: Compile Tauri desktop shell
        shell: bash
        run: |
          cargo +1.91.0 check             --manifest-path apps/pulqva-desktop/src-tauri/Cargo.toml             --all-targets

      - name: Run desktop boundary tests
        shell: bash
        run: |
          cargo +1.91.0 test \
            --manifest-path apps/pulqva-desktop/src-tauri/Cargo.toml \
            --all-targets

      - name: Prepare authenticated real FFmpeg archive and reference hash
        shell: bash
        run: python apps/pulqva-desktop/tests/prepare_ffmpeg_fixture.py

      - name: Prepare authenticated real Deno archive and independent reference
        shell: bash
        run: python apps/pulqva-desktop/tests/prepare_deno_fixture.py

      - name: Verify real Deno source extraction staging and cleanup
        shell: bash
        run: |
          cargo +1.91.0 test \
            --manifest-path apps/pulqva-desktop/src-tauri/Cargo.toml \
            --all-targets \
            deno_archive_compat::pinned_archive_matches_independent_extractor_and_owned_stage \
            -- --ignored --exact --nocapture

      - name: Verify pinned Deno runtime owned workspace and cleanup
        shell: bash
        run: |
          cargo +1.91.0 test \
            --manifest-path apps/pulqva-desktop/src-tauri/Cargo.toml \
            --all-targets \
            deno_runtime_compat::pinned_runtime_uses_owned_environment_and_cleans_after_exit \
            -- --ignored --exact --nocapture

      - name: Preserve independent Deno reference receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deno-compat-reference-${{ matrix.os }}
          path: ${{ runner.temp }}/deno-compat-reference.json
          if-no-files-found: warn

      - name: Verify actual pinned archive with the production extraction adapters
        shell: bash
        run: |
          cargo +1.91.0 test \
            --manifest-path apps/pulqva-desktop/src-tauri/Cargo.toml \
            --all-targets \
            ffmpeg_archive_compat::pinned_archive_matches_independent_extractor \
            -- --ignored --exact --nocapture

      - name: Preserve independent FFmpeg reference receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-compat-reference-${{ matrix.os }}
          path: ${{ runner.temp }}/ffmpeg-compat-reference.json
          if-no-files-found: warn
