name: desktop-shell-check

on:
  pull_request:
    paths:
      - "apps/pulqva-desktop/**"
      - "sidecars/deno/**"
      - ".github/workflows/desktop-shell-check.yml"
  push:
    branches: ["main"]
    paths:
      - "apps/pulqva-desktop/**"
      - "sidecars/deno/**"
      - ".github/workflows/desktop-shell-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.91.0 --profile minimal
          rustup default 1.91.0

      - name: Install Linux Tauri build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y             libwebkit2gtk-4.1-dev             libayatana-appindicator3-dev             librsvg2-dev             patchelf

      - name: Reject frontend-owned Internet access
        shell: bash
        run: |
          set -euo pipefail

          FRONTEND="apps/pulqva-desktop/frontend"

          if grep -R -n -E             'fetch[[:space:]]*\(|XMLHttpRequest|WebSocket|EventSource|navigator\.sendBeacon|https?://'             "$FRONTEND"; then
            echo "frontend external-network surface detected"
            exit 1
          fi

          grep -F             "connect-src ipc: http://ipc.localhost"             apps/pulqva-desktop/src-tauri/tauri.conf.json

      - name: Require committed desktop dependency lock
        shell: bash
        run: |
          git ls-files --error-unmatch apps/pulqva-desktop/src-tauri/Cargo.lock
          test -s apps/pulqva-desktop/src-tauri/Cargo.lock

      - name: Preserve committed desktop lock before compilation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-cargo-lock-${{ matrix.os }}
          path: apps/pulqva-desktop/src-tauri/Cargo.lock
          if-no-files-found: error

      - name: Verify frontend request-generation isolation
        shell: bash
        run: node --test apps/pulqva-desktop/frontend/test_async_generation.mjs apps/pulqva-desktop/frontend/test_prototype.mjs

      - name: Verify frozen prototype E2E admission preflight (NOT live)
        shell: bash
        run: python -m unittest discover -s tools/ci -p test_prototype_e2e_admission.py -v

      - name: Compile Tauri desktop shell
        shell: bash
        run: |
          cargo +1.91.0 check --locked --manifest-path apps/pulqva-desktop/src-tauri/Cargo.toml --all-targets

      - name: Run desktop boundary tests
        shell: bash
        run: |
          cargo +1.91.0 test --locked \
            --manifest-path apps/pulqva-desktop/src-tauri/Cargo.toml \
            --all-targets

      - name: Prepare authenticated real FFmpeg archive and reference hash
        shell: bash
        run: python apps/pulqva-desktop/tests/prepare_ffmpeg_fixture.py

      - name: Prepare authenticated real Deno archive and independent reference
        shell: bash
        run: python apps/pulqva-desktop/tests/prepare_deno_fixture.py

      - name: Verify real Deno source extraction staging and cleanup
        shell: bash
        run: |
          cargo +1.91.0 test --locked \
            --manifest-path apps/pulqva-desktop/src-tauri/Cargo.toml \
            --all-targets \
            deno_archive_compat::pinned_archive_matches_independent_extractor_and_owned_stage \
            -- --ignored --exact --nocapture

      - name: Verify pinned Deno runtime owned workspace and cleanup
        shell: bash
        run: |
          cargo +1.91.0 test --locked \
            --manifest-path apps/pulqva-desktop/src-tauri/Cargo.toml \
            --all-targets \
            deno_runtime_compat::pinned_runtime_uses_owned_environment_and_cleans_after_exit \
            -- --ignored --exact --nocapture

      - name: Preserve independent Deno reference receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deno-compat-reference-${{ matrix.os }}
          path: ${{ runner.temp }}/deno-compat-reference.json
          if-no-files-found: warn

      - name: Verify actual pinned archive with the production extraction adapters
        shell: bash
        run: |
          cargo +1.91.0 test --locked \
            --manifest-path apps/pulqva-desktop/src-tauri/Cargo.toml \
            --all-targets \
            ffmpeg_archive_compat::pinned_archive_matches_independent_extractor \
            -- --ignored --exact --nocapture

      - name: Preserve independent FFmpeg reference receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-compat-reference-${{ matrix.os }}
          path: ${{ runner.temp }}/ffmpeg-compat-reference.json
          if-no-files-found: warn

  tor-diagnostics-unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        shell: bash
        run: rustup toolchain install 1.91.0 --profile minimal
      - name: Test bounded diagnostic formatter against real privacy crate
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/tor-diagnostics-unit"
          mkdir -p "$out"
          export CARGO_MANIFEST_DIR="$GITHUB_WORKSPACE/crates/pulqva-privacy"
          rustc +1.91.0 --edition=2024 --crate-name pulqva_privacy --crate-type rlib crates/pulqva-privacy/src/lib.rs -o "$out/libpulqva_privacy.rlib" 2>&1 | tee "$out/privacy-compile.txt"
          rustc +1.91.0 --edition=2024 --test apps/pulqva-desktop/src-tauri/src/tor_diagnostics.rs --extern "pulqva_privacy=$out/libpulqva_privacy.rlib" -o "$out/diagnostics-tests.exe" 2>&1 | tee "$out/diagnostics-compile.txt"
          "$out/diagnostics-tests.exe" --test-threads=1 2>&1 | tee "$out/test-results.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tor-diagnostics-unit-${{ matrix.os }}
          path: ${{ runner.temp }}/tor-diagnostics-unit/*.txt
          if-no-files-found: error
          retention-days: 14

  diagnostic-app-artifact:
    needs: tor-diagnostics-unit
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: source
    env:
      PULQVA_FROZEN_SOURCE: b217e0816f217ca1e65b63283dcb4cd0ab0ac79a
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: driver
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: b217e0816f217ca1e65b63283dcb4cd0ab0ac79a
          path: source
          persist-credentials: false
      - name: Assert frozen source and clean input tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PULQVA_FROZEN_SOURCE"
          test -z "$(git status --porcelain)"
          python ../driver/tools/ci/diagnostic_input_guard.py snapshot . "$RUNNER_TEMP/pr98-input-snapshot.json"
      - name: Test strict tracked-input and generated-output guard
        shell: bash
        run: python ../driver/tools/ci/test_diagnostic_input_guard.py
      - name: Install pinned Rust
        shell: bash
        run: rustup toolchain install 1.91.0 --profile minimal
      - name: Linux Tauri prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Build diagnostic app without rebuilding sidecars
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/pr98-diagnostic-target
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.91.0 build --release --locked --manifest-path apps/pulqva-desktop/src-tauri/Cargo.toml
          git diff --exit-code
      - name: Bind binary to source, workflow and effective input manifests
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/pr98-diagnostic-target
        shell: python
        run: |
          import hashlib, json, os, pathlib, shutil, subprocess, sys
          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "source"
          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert sha == os.environ["PULQVA_FROZEN_SOURCE"]
          windows = os.environ["RUNNER_OS"] == "Windows"
          platform = "windows" if windows else "linux"
          guard = root.parent / "driver" / "tools" / "ci" / "diagnostic_input_guard.py"
          baseline = pathlib.Path(os.environ["RUNNER_TEMP"]) / "pr98-input-snapshot.json"
          input_report = json.loads(subprocess.check_output([sys.executable,str(guard),"verify",str(root),str(baseline),platform],text=True))
          suffix = ".exe" if windows else ""
          built = pathlib.Path(os.environ["CARGO_TARGET_DIR"]) / "release" / ("pulqva-desktop" + suffix)
          assert built.is_file()
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "pr98-diagnostic-app"
          out.mkdir(exist_ok=False)
          app = out / ("PULQVA" + suffix)
          shutil.copyfile(built, app)
          paths = ["Cargo.lock", "apps/pulqva-desktop/src-tauri/Cargo.lock", "sidecars/arti/VERSION", "sidecars/arti/SHA256SUMS", "sidecars/arti/linux-x86_64/VERSION", "sidecars/yt-dlp/VERSION", "sidecars/yt-dlp/SHA256SUMS", "sidecars/ffmpeg/VERSION", "sidecars/ffmpeg/SHA256SUMS"]
          manifests = {p: hashlib.sha256((root/p).read_bytes()).hexdigest() for p in paths if (root/p).is_file()}
          receipt = dict(schema=1, status="BUILT_NOT_LIVE_VERIFIED", source_sha=sha, workflow_sha=os.environ["GITHUB_SHA"], workflow_ref=os.environ.get("GITHUB_WORKFLOW_REF"), run_id=os.environ["GITHUB_RUN_ID"], attempt=os.environ["GITHUB_RUN_ATTEMPT"], job=os.environ["GITHUB_JOB"], runner_os=os.environ["RUNNER_OS"], runner_arch=os.environ["RUNNER_ARCH"], rustc=subprocess.check_output(["rustc","+1.91.0","--version"],text=True).strip(), cargo=subprocess.check_output(["cargo","+1.91.0","--version"],text=True).strip(), build_flags="--release --locked", app=app.name, app_bytes=app.stat().st_size, app_sha256=hashlib.sha256(app.read_bytes()).hexdigest(), manifests=manifests, checkout_clean_before_build=True, tracked_inputs_unchanged=True, generated_outputs=input_report['generated'], input_snapshot_sha256=hashlib.sha256(baseline.read_bytes()).hexdigest(), guard_sha256=hashlib.sha256(guard.read_bytes()).hexdigest(), source_overlay=None, bundled_sidecars=False, runtime_executed=False, diagnostics_opt_in="PULQVA_TOR_DIAGNOSTICS=1", linux_pairing="Before runtime verify compiled root Arti digest against chosen sidecar; historical Linux package used a manifest overlay not present in this exact-tree build.")
          (out/"build-receipt.json").write_text(json.dumps(receipt,indent=2)+"\n", encoding="utf-8")
          print(json.dumps(receipt,indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: pr98-diagnostic-app-${{ matrix.os }}-b217e0816f21
          path: ${{ runner.temp }}/pr98-diagnostic-app/
          if-no-files-found: error
          retention-days: 14
