name: ytdlp-tor-media-check

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  media:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.91.0 --profile minimal
          rustup default 1.91.0

      - name: Test bounded public-fixture diagnostics
        run: cargo test --locked -p pulqva-privacy --example real_ytdlp_tor_media

      - name: Build exact pinned Arti sidecar
        shell: bash
        run: |
          set -euo pipefail

          ARTI_VERSION="$(tr -d '\r\n' < sidecars/arti/VERSION)"
          test "$ARTI_VERSION" = "2.6.0"

          EXTRA_FEATURES=()
          if [ "$RUNNER_OS" = "Windows" ]; then
            EXTRA_FEATURES=(--features static-sqlite)
          fi

          cargo +1.91.0 install arti \
            --version "$ARTI_VERSION" \
            --locked \
            "${EXTRA_FEATURES[@]}" \
            --root "$RUNNER_TEMP/arti-root"

          ARTI_BIN="$RUNNER_TEMP/arti-root/bin/arti"
          if [ "$RUNNER_OS" = "Windows" ]; then
            ARTI_BIN="${ARTI_BIN}.exe"
          fi
          test -f "$ARTI_BIN"
          echo "ARTI_BIN=$ARTI_BIN" >> "$GITHUB_ENV"

      - name: Download and verify exact pinned yt-dlp sidecar
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(tr -d '\r\n' < sidecars/yt-dlp/VERSION)"
          test "$VERSION" = "2026.08.19"

          if [ "$RUNNER_OS" = "Windows" ]; then
            ASSET="yt-dlp.exe"
          else
            ASSET="yt-dlp_linux"
          fi

          EXPECTED="$(awk -v asset="$ASSET" '$2 == asset {print $1}' sidecars/yt-dlp/SHA256SUMS)"
          test -n "$EXPECTED"

          BIN="$RUNNER_TEMP/$ASSET"
          URL="https://github.com/yt-dlp/yt-dlp/releases/download/$VERSION/$ASSET"
          curl --fail --location --retry 3 --retry-delay 2 --output "$BIN" "$URL"

          if [ "$RUNNER_OS" = "Windows" ]; then
            ACTUAL="$(powershell.exe -NoProfile -Command "(Get-FileHash -Algorithm SHA256 -LiteralPath '$BIN').Hash.ToLowerInvariant()" | tr -d '\r\n')"
            EXEC_BIN="$(cygpath -u "$BIN")"
          else
            ACTUAL="$(sha256sum "$BIN" | awk '{print $1}')"
            chmod +x "$BIN"
            EXEC_BIN="$BIN"
          fi

          test "$ACTUAL" = "$EXPECTED"
          VERSION_OUTPUT="$("$EXEC_BIN" --version)"
          test "$VERSION_OUTPUT" = "$VERSION"

          echo "YTDLP_BIN=$EXEC_BIN" >> "$GITHUB_ENV"

      - name: Prove one bounded real media download through Tor
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT="$(cargo +1.91.0 run \
            --quiet \
            --locked \
            -p pulqva-privacy \
            --example real_ytdlp_tor_media \
            -- "$ARTI_BIN" "$YTDLP_BIN" --diagnostics)"
          echo "$OUTPUT"

          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "$OUTPUT" | grep -E 'PULQVA_YTDLP_TOR_MEDIA(_WINDOWS_FAIL_CLOSED)?_OK'
          else
            echo "$OUTPUT" | grep -F 'PULQVA_YTDLP_TOR_MEDIA_OK'
          fi
