name: ytdlp-tor-media-check
run-name: "${{ github.event_name == 'workflow_dispatch' && 'Admitted media requested' || 'Contracts only; live NOT TESTED' }} (${{ github.event_name }})"

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact full source SHA; must equal the selected dispatch ref
        required: true
        type: string
      profile:
        description: Fixed fixture profile; neither accepts arbitrary queries or executables
        required: true
        type: choice
        default: fixed-public-media
        options:
          - fixed-public-media
          - retained-commons

permissions:
  contents: read

env:
  PULQVA_MEDIA_PROFILE: ${{ inputs.profile || 'fixed-public-media' }}

concurrency:
  group: media-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  admission:
    name: Media admission (not live evidence)
    needs: contracts
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      admitted: ${{ steps.admission.outputs.admitted }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read same-run native prerequisite
        if: ${{ github.event_name == 'workflow_dispatch' && needs.contracts.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: media-native-prerequisite-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/media-prerequisite
      - name: Admit only exact-source tested media request
        id: admission
        if: always()
        env:
          PULQVA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PULQVA_REQUESTED_SOURCE: ${{ inputs.source_sha }}
          PULQVA_CONTRACTS_RESULT: ${{ needs.contracts.result }}
          PULQVA_MEDIA_PREREQUISITE: ${{ runner.temp }}/media-prerequisite
        run: python3 tools/ci/legacy_live_guard.py ytdlp-tor-media-check "$RUNNER_TEMP/live-admission"
      - name: Retain explicit admission scope
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-admission-ytdlp-tor-media-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/live-admission/live-status.json
          if-no-files-found: error
          retention-days: 90

  contracts:
    name: Deterministic contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test positive admission and bounded capture without Tor
        run: python -m unittest discover -s tools/ci -p 'test_media_evidence.py' -v
      - name: Test existing retained-file readback and native collector without Tor
        run: |
          python -m unittest discover -s tools/ci -p 'test_retained_commons.py' -v
          python -m unittest discover -s tools/ci -p 'test_readiness_contract_matrix.py' -v
      - name: Install pinned Rust
        run: rustup toolchain install 1.91.0 --profile minimal
      - name: Run existing deterministic contracts (no live Tor)
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.91.0 test --locked -p pulqva-privacy --example real_ytdlp_tor_media
          cargo +1.91.0 test --locked -p pulqva-core -p pulqva-discovery --all-targets
      - name: Native prerequisite for this explicit generation
        if: ${{ github.event_name == 'workflow_dispatch' && runner.os == 'Linux' }}
        env:
          PULQVA_SOURCE_SHA: ${{ github.sha }}
        run: python3 tools/ci/readiness_contract_matrix.py "$RUNNER_TEMP/media-native-prerequisite"
      - name: Native retained-file prerequisite for this explicit profile
        if: ${{ github.event_name == 'workflow_dispatch' && runner.os == 'Linux' && inputs.profile == 'retained-commons' }}
        env:
          PULQVA_SOURCE_SHA: ${{ github.sha }}
        run: python3 tools/ci/readiness_contract_matrix.py "$RUNNER_TEMP/media-native-prerequisite/retained-commons" --retained-commons
      - name: Retain same-run native prerequisite
        if: ${{ always() && github.event_name == 'workflow_dispatch' && runner.os == 'Linux' }}
        uses: actions/upload-artifact@v4
        with:
          name: media-native-prerequisite-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/media-native-prerequisite/
          if-no-files-found: error
          retention-days: 90

  media:
    needs: [admission, contracts]
    if: ${{ github.event_name == 'workflow_dispatch' && needs.admission.outputs.admitted == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PULQVA_SOURCE_SHA: ${{ github.sha }}
      PULQVA_REQUESTED_SOURCE: ${{ inputs.source_sha }}
      PULQVA_CONTRACTS_RESULT: ${{ needs.contracts.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: media-native-prerequisite-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/media-prerequisite
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.91.0 --profile minimal
          rustup default 1.91.0

      - name: Test bounded public-fixture diagnostics
        run: cargo test --locked -p pulqva-privacy --example real_ytdlp_tor_media

      - name: Build exact pinned Arti sidecar
        shell: bash
        run: |
          set -euo pipefail

          ARTI_VERSION="$(tr -d '\r\n' < sidecars/arti/VERSION)"
          test "$ARTI_VERSION" = "2.6.0"

          EXTRA_FEATURES=()
          if [ "$RUNNER_OS" = "Windows" ]; then
            EXTRA_FEATURES=(--features static-sqlite)
          fi

          cargo +1.91.0 install arti \
            --version "$ARTI_VERSION" \
            --locked \
            "${EXTRA_FEATURES[@]}" \
            --root "$RUNNER_TEMP/arti-root"

          ARTI_BIN="$RUNNER_TEMP/arti-root/bin/arti"
          if [ "$RUNNER_OS" = "Windows" ]; then
            ARTI_BIN="${ARTI_BIN}.exe"
          fi
          test -f "$ARTI_BIN"
          echo "ARTI_BIN=$ARTI_BIN" >> "$GITHUB_ENV"

      - name: Download and verify exact pinned yt-dlp sidecar
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(tr -d '\r\n' < sidecars/yt-dlp/VERSION)"
          test "$VERSION" = "2026.08.19"

          if [ "$RUNNER_OS" = "Windows" ]; then
            ASSET="yt-dlp.exe"
          else
            ASSET="yt-dlp_linux"
          fi

          EXPECTED="$(awk -v asset="$ASSET" '$2 == asset {print $1}' sidecars/yt-dlp/SHA256SUMS)"
          test -n "$EXPECTED"

          BIN="$RUNNER_TEMP/$ASSET"
          URL="https://github.com/yt-dlp/yt-dlp/releases/download/$VERSION/$ASSET"
          curl --fail --location --retry 3 --retry-delay 2 --output "$BIN" "$URL"

          if [ "$RUNNER_OS" = "Windows" ]; then
            ACTUAL="$(powershell.exe -NoProfile -Command "(Get-FileHash -Algorithm SHA256 -LiteralPath '$BIN').Hash.ToLowerInvariant()" | tr -d '\r\n')"
            EXEC_BIN="$(cygpath -u "$BIN")"
          else
            ACTUAL="$(sha256sum "$BIN" | awk '{print $1}')"
            chmod +x "$BIN"
            EXEC_BIN="$BIN"
          fi

          test "$ACTUAL" = "$EXPECTED"
          VERSION_OUTPUT="$("$EXEC_BIN" --version)"
          test "$VERSION_OUTPUT" = "$VERSION"

          echo "YTDLP_BIN=$EXEC_BIN" >> "$GITHUB_ENV"

      - name: Prebuild existing fixture before freezing evidence
        if: ${{ env.PULQVA_MEDIA_PROFILE == 'fixed-public-media' }}
        run: cargo +1.91.0 build --locked -p pulqva-privacy --example real_ytdlp_tor_media
      - name: Prebuild existing retained Commons fixture before freezing evidence
        if: ${{ env.PULQVA_MEDIA_PROFILE == 'retained-commons' }}
        run: cargo +1.91.0 build --locked -p pulqva-discovery --example real_commons_file
      - name: Capture one immutable existing Tor media fixture
        if: ${{ env.PULQVA_MEDIA_PROFILE == 'fixed-public-media' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci/media_evidence.py capture \
            "$RUNNER_TEMP/media-evidence" "$RUNNER_TEMP/media-prerequisite" \
            "$GITHUB_WORKSPACE/target/debug/examples/real_ytdlp_tor_media" "$ARTI_BIN" "$YTDLP_BIN"
      - name: Capture one selected retained Commons journey
        if: ${{ env.PULQVA_MEDIA_PROFILE == 'retained-commons' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci/media_evidence.py capture-retained \
            "$RUNNER_TEMP/media-evidence" "$RUNNER_TEMP/media-prerequisite" \
            "$GITHUB_WORKSPACE/target/debug/examples/real_commons_file" "$ARTI_BIN" "$YTDLP_BIN"
      - name: Close actual evidence or mark preparation NOT TESTED
        if: always()
        env:
          PULQVA_JOB_STATUS: ${{ job.status }}
        run: python3 tools/ci/media_evidence.py finalize "$RUNNER_TEMP/media-evidence" "$PULQVA_JOB_STATUS"
      - name: Retain bounded public evidence (no Tor state or cache)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulqva-media-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/media-evidence/*.json
            ${{ runner.temp }}/media-evidence/stdout.bin
            ${{ runner.temp }}/media-evidence/stderr.bin
            ${{ runner.temp }}/media-evidence/retained-file/receipt.json
            ${{ runner.temp }}/media-evidence/retained-file/selected.webm
          if-no-files-found: error
          retention-days: 90
