name: intent-model-qwen08-smoke

on:
  pull_request:
    paths:
      - "eval/intent/**"
      - "sidecars/llama.cpp/**"
      - ".github/workflows/intent-model-qwen08-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        id: checkout
      - name: Fetch exact llama.cpp source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama.cpp"
          git -C "$RUNNER_TEMP/llama.cpp" fetch --depth=1 origin tag v0.4.1
          git -C "$RUNNER_TEMP/llama.cpp" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/llama.cpp" rev-parse HEAD)" = "b29c606e28a01b1bc8c1351026a0fa6e616bf6c4"
      - name: Build pinned CPU llama-cli
        id: build
        shell: bash
        run: |
          set -euo pipefail
          cmake -S "$RUNNER_TEMP/llama.cpp" -B "$RUNNER_TEMP/llama-build" -DCMAKE_BUILD_TYPE=Release -DLLAMA_BUILD_IS_DEV=ON -DGGML_CUDA=OFF -DGGML_VULKAN=OFF -DGGML_METAL=OFF -DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=ON -DBUILD_SHARED_LIBS=OFF -DGGML_BACKEND_DL=OFF -DLLAMA_OPENSSL=OFF
          cmake --build "$RUNNER_TEMP/llama-build" --config Release --target llama-cli --parallel 2
          "$RUNNER_TEMP/llama-build/bin/llama-cli" --version
      - name: Materialize pinned official GGUF
        shell: bash
        run: |
          set -euo pipefail
          model="$RUNNER_TEMP/Qwen3.5-0.8B-Q4_0.gguf"
          curl --fail --location --retry 3 --retry-delay 2 -o "$model" "https://huggingface.co/ggml-org/Qwen3.5-0.8B-GGUF/resolve/main/Qwen3.5-0.8B-Q4_0.gguf?download=true"
          actual="$(sha256sum "$model" | awk '{print $1}')"
          echo "MODEL_SHA256=$actual"
          test "$actual" = "57d1997790d1744fba5b40a7317df71ea5e2acee28c47e78f0cce39c0703f8cf"
      - name: Control A - Qwen unconstrained 16 tokens
        id: qwen_control
        shell: bash
        run: |
          set -euo pipefail
          prompt='Reply with only the words countdown video. User request: найди видео с обратным отсчётом на десять минут'
          timeout 30 "$RUNNER_TEMP/llama-build/bin/llama-cli" \
            -m "$RUNNER_TEMP/Qwen3.5-0.8B-Q4_0.gguf" \
            -p "$prompt" -n 16 --temp 0 --no-display-prompt --simple-io --single-turn \
            > "$RUNNER_TEMP/qwen-control.txt" 2> "$RUNNER_TEMP/qwen-stderr.txt"
          test -s "$RUNNER_TEMP/qwen-control.txt"
          head -c 1000 "$RUNNER_TEMP/qwen-control.txt"
          echo
          echo PULQVA_QWEN08_UNCONSTRAINED_CONTROL_OK

      # A failed control must remain red, but cannot suppress the other model.
      - name: Control B - materialize SmolLM2 1.7B Q4_K_M
        id: smol_model
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          model="$RUNNER_TEMP/SmolLM2-1.7B-Instruct-Q4_K_M.gguf"
          curl --fail --location --retry 3 --retry-delay 2 -o "$model" \
            "https://huggingface.co/lmstudio-community/SmolLM2-1.7B-Instruct-GGUF/resolve/69467cdeb964c7bef9f417f3d6c6de83702d4855/SmolLM2-1.7B-Instruct-Q4_K_M.gguf?download=true"
          test -s "$model"
          echo "SMOLLM2_BYTES=$(stat -c %s "$model")"
          actual="$(sha256sum "$model" | awk '{print $1}')"
          echo "SMOLLM2_SHA256=$actual"
          test "$(stat -c %s "$model")" = "1055609536"
          test "$actual" = "48db74b86a7e5f1d177f8efbf9929aa3e42bdb07bdc338c14a380a90cd98bde6"

      - name: Control B - SmolLM2 constrained intent
        id: smol_control
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.smol_model.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/intent.gbnf" <<'GBNF'
          root ::= "{" ws "\"query\"" ws ":" ws string ws "," ws "\"choice_mode\"" ws ":" ws mode ws "}"
          mode ::= "\"ask\"" | "\"autopilot\""
          string ::= "\"" chars "\""
          chars ::= char chars | char
          char ::= [^"\\\\\x00-\x1F]
          ws ::= [ \t\n\r]*
          GBNF
          prompt='Return only JSON. Convert this request to query and choice_mode. choice_mode is ask unless the user explicitly asks you to choose. User request: find a ten minute countdown video'
          timeout 60 "$RUNNER_TEMP/llama-build/bin/llama-cli" \
            -m "$RUNNER_TEMP/SmolLM2-1.7B-Instruct-Q4_K_M.gguf" \
            -p "$prompt" -n 64 --temp 0 --grammar-file "$RUNNER_TEMP/intent.gbnf" \
            --no-display-prompt --simple-io --single-turn > "$RUNNER_TEMP/smol-output.txt" 2> "$RUNNER_TEMP/smol-stderr.txt"
          cat "$RUNNER_TEMP/smol-output.txt"
          python3 - <<'PY'
          import json, pathlib, os
          raw=pathlib.Path(os.environ["RUNNER_TEMP"]+"/smol-output.txt").read_text().strip()
          start,end=raw.find("{"),raw.rfind("}")
          if start < 0 or end < start: raise SystemExit("no JSON object")
          obj=json.loads(raw[start:end+1])
          if set(obj) != {"query","choice_mode"}: raise SystemExit("authority/schema drift")
          if obj["choice_mode"] != "ask": raise SystemExit("wrong choice mode")
          if "countdown" not in obj["query"].lower(): raise SystemExit("semantic query failure")
          pathlib.Path(os.environ["RUNNER_TEMP"]+"/smol-intent.json").write_text(
              json.dumps(obj, ensure_ascii=False, separators=(",",":")), encoding="utf-8")
          print("PULQVA_SMOLLM2_CONSTRAINED_CONTROL_OK", json.dumps(obj,ensure_ascii=False))
          PY

      - name: T069-E - require real model output through Rust typed boundary
        id: rust_boundary
        if: ${{ !cancelled() && steps.smol_control.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rust-boundary/src"
          cat > "$RUNNER_TEMP/rust-boundary/Cargo.toml" <<EOF
          [package]
          name = "pulqva-t069e-boundary-check"
          version = "0.0.0"
          edition = "2024"
          publish = false

          [dependencies]
          pulqva-core = { path = "$GITHUB_WORKSPACE/crates/pulqva-core" }
          pulqva-intent-json = { path = "$GITHUB_WORKSPACE/crates/pulqva-intent-json" }

          [workspace]
          EOF
          cat > "$RUNNER_TEMP/rust-boundary/src/main.rs" <<'RS'
          use pulqva_core::ChoiceMode;
          use std::io::{self, Read};

          fn main() {
              let mut input = String::new();
              io::stdin().read_to_string(&mut input).expect("read model output");
              let interpreted = pulqva_intent_json::parse_interpreted_intent_json(input.trim())
                  .expect("real model output must cross strict JSON + InterpretedIntent validation");
              assert_eq!(interpreted.choice_mode(), ChoiceMode::Ask);
              assert!(interpreted.query().to_ascii_lowercase().contains("countdown"));
              let search = interpreted.into_search_intent()
                  .expect("validated interpreted intent must enter SearchIntent");
              assert!(search.query().to_ascii_lowercase().contains("countdown"));
              println!("PULQVA_T069E_RUST_BOUNDARY_OK query={}", search.query());
          }
          RS
          cargo run --quiet --manifest-path "$RUNNER_TEMP/rust-boundary/Cargo.toml" < "$RUNNER_TEMP/smol-intent.json" > "$RUNNER_TEMP/rust-boundary.txt"
          cat "$RUNNER_TEMP/rust-boundary.txt"

      - name: Preserve diagnostic evidence even when a control fails
        id: evidence
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: bash
        env:
          STEP_STATES: ${{ toJSON(steps) }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil, subprocess
          tmp = pathlib.Path(os.environ["RUNNER_TEMP"])
          out = tmp / "pulqva-intent-control"
          out.mkdir()
          event = json.loads(pathlib.Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          states = json.loads(os.environ["STEP_STATES"])
          receipt = {
              "scope": "T069-E diagnostic controls; NOT product acceptance",
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "source_head": event["pull_request"]["head"]["sha"],
              "checkout_sha": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "llama_source_expected": "b29c606e28a01b1bc8c1351026a0fa6e616bf6c4",
              "qwen_sha256_expected": "57d1997790d1744fba5b40a7317df71ea5e2acee28c47e78f0cce39c0703f8cf",
              "smol_sha256_expected": "48db74b86a7e5f1d177f8efbf9929aa3e42bdb07bdc338c14a380a90cd98bde6",
              "outcomes": {key: value["outcome"] for key, value in states.items()},
              "files": {},
          }
          for name in ("intent.gbnf", "qwen-control.txt", "qwen-stderr.txt", "smol-output.txt", "smol-stderr.txt", "smol-intent.json", "rust-boundary.txt"):
              source = tmp / name
              if not source.is_file():
                  receipt["files"][name] = {"present": False}
                  continue
              data = source.read_bytes()
              shutil.copyfile(source, out / name)
              receipt["files"][name] = {"present": True, "bytes": len(data), "sha256": hashlib.sha256(data).hexdigest()}
              print("=== " + name + " (first 4096 bytes) ===")
              print(data[:4096].decode("utf-8", errors="replace"))
          text = json.dumps(receipt, indent=2, ensure_ascii=False)
          (out / "receipt.json").write_text(text + "\n", encoding="utf-8")
          print(text)
          PY
      - name: Upload fixed-public-fixture diagnostics
        if: ${{ !cancelled() && steps.evidence.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: t069e-model-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pulqva-intent-control/
          if-no-files-found: error
          retention-days: 7
