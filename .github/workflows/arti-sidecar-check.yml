name: arti-sidecar-check

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            executable: arti
            feature_args: ""
          - os: windows-latest
            platform: windows-x86_64
            executable: arti.exe
            feature_args: "--features static-sqlite"
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.91.0 --profile minimal
          rustup default 1.91.0

      - name: Build exact Arti identity candidate without running Tor
        shell: bash
        env:
          PULQVA_ARTI_PLATFORM: ${{ matrix.platform }}
          PULQVA_ARTI_EXECUTABLE: ${{ matrix.executable }}
          PULQVA_ARTI_FEATURE_ARGS: ${{ matrix.feature_args }}
        run: |
          set -euo pipefail

          ARTI_VERSION="$(tr -d '\r\n' < sidecars/arti/VERSION)"
          test "$ARTI_VERSION" = "2.6.0"

          INSTALL_ROOT="$RUNNER_TEMP/pulqva-arti-root"
          TARGET_ROOT="$RUNNER_TEMP/pulqva-arti-target"
          rm -rf "$INSTALL_ROOT" "$TARGET_ROOT"

          FEATURE_ARGS=()
          if [ -n "$PULQVA_ARTI_FEATURE_ARGS" ]; then
            FEATURE_ARGS=($PULQVA_ARTI_FEATURE_ARGS)
          fi

          if [ "$RUNNER_OS" = "Windows" ]; then
            export RUSTFLAGS="-C link-arg=/Brepro"
          fi

          CARGO_INCREMENTAL=0           cargo +1.91.0 install arti             --version "$ARTI_VERSION"             --locked             "${FEATURE_ARGS[@]}"             --root "$INSTALL_ROOT"             --target-dir "$TARGET_ROOT"

          ARTI_BIN="$INSTALL_ROOT/bin/$PULQVA_ARTI_EXECUTABLE"
          test -f "$ARTI_BIN"

          echo "PULQVA_ARTI_BIN=$ARTI_BIN" >> "$GITHUB_ENV"
          echo "PULQVA_ARTI_VERSION=$ARTI_VERSION" >> "$GITHUB_ENV"

      - name: Verify Arti binary and proxy CLI without bootstrapping
        shell: bash
        run: |
          set -euo pipefail
          VERSION_OUTPUT="$("$PULQVA_ARTI_BIN" --version)"
          echo "$VERSION_OUTPUT"
          echo "$VERSION_OUTPUT" | grep -F "$PULQVA_ARTI_VERSION"
          "$PULQVA_ARTI_BIN" help proxy > "$RUNNER_TEMP/arti-proxy-help.txt"
          grep -i "proxy" "$RUNNER_TEMP/arti-proxy-help.txt"

      - name: Emit exact packaged-executable identity candidate
        shell: bash
        env:
          PULQVA_ARTI_PLATFORM: ${{ matrix.platform }}
          PULQVA_ARTI_EXECUTABLE: ${{ matrix.executable }}
          PULQVA_ARTI_FEATURE_ARGS: ${{ matrix.feature_args }}
        run: |
          set -euo pipefail

          if [ "$RUNNER_OS" = "Windows" ]; then
            SHA256="$(powershell.exe -NoProfile -Command "(Get-FileHash -Algorithm SHA256 -LiteralPath '$PULQVA_ARTI_BIN').Hash.ToLowerInvariant()" | tr -d '\r\n')"
          else
            SHA256="$(sha256sum "$PULQVA_ARTI_BIN" | awk '{print $1}')"
          fi

          test "${#SHA256}" -eq 64
          echo "$SHA256" | grep -Eq '^[0-9a-f]{64}$'

          BYTE_SIZE="$(wc -c < "$PULQVA_ARTI_BIN" | tr -d '[:space:]')"
          test "$BYTE_SIZE" -gt 0

          IDENTITY_ASSET="$PULQVA_ARTI_PLATFORM/$PULQVA_ARTI_EXECUTABLE"
          MATCH_COUNT="$(awk -v asset="$IDENTITY_ASSET" '$2 == asset { count++ } END { print count + 0 }' sidecars/arti/SHA256SUMS)"
          test "$MATCH_COUNT" -eq 1
          EXPECTED_SHA256="$(awk -v asset="$IDENTITY_ASSET" '$2 == asset { print $1 }' sidecars/arti/SHA256SUMS)"
          test "${#EXPECTED_SHA256}" -eq 64
          echo "$EXPECTED_SHA256" | grep -Eq '^[0-9a-f]{64}$'

          RECEIPT="$RUNNER_TEMP/arti-identity-${PULQVA_ARTI_PLATFORM}.txt"
          {
            echo "platform=$PULQVA_ARTI_PLATFORM"
            echo "version=$PULQVA_ARTI_VERSION"
            echo "executable=$PULQVA_ARTI_EXECUTABLE"
            echo "sha256=$SHA256"
            echo "expected_sha256=$EXPECTED_SHA256"
            echo "byte_size=$BYTE_SIZE"
            echo "rust_toolchain=1.91.0"
            echo "cargo_locked=true"
            echo "feature_args=$PULQVA_ARTI_FEATURE_ARGS"
          } > "$RECEIPT"

          cat "$RECEIPT"
          echo "PULQVA_ARTI_IDENTITY_COMPARE platform=$PULQVA_ARTI_PLATFORM actual_sha256=$SHA256 expected_sha256=$EXPECTED_SHA256 byte_size=$BYTE_SIZE"
          echo "PULQVA_ARTI_IDENTITY platform=$PULQVA_ARTI_PLATFORM version=$PULQVA_ARTI_VERSION executable=$PULQVA_ARTI_EXECUTABLE sha256=$SHA256 byte_size=$BYTE_SIZE"
          test "$SHA256" = "$EXPECTED_SHA256"

      - name: Capture exact built Arti artifact for immutable-source recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arti-identity-candidate-${{ matrix.platform }}
          path: |
            ${{ env.PULQVA_ARTI_BIN }}
            ${{ runner.temp }}/arti-identity-${{ matrix.platform }}.txt
          if-no-files-found: error
          retention-days: 30
