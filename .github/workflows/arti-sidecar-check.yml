name: arti-sidecar-check

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            executable: arti
            feature_args: ""
          - os: windows-latest
            platform: windows-x86_64
            executable: arti.exe
            feature_args: "--features static-sqlite"
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.91.0 --profile minimal
          rustup default 1.91.0

      - name: Select and authenticate Windows native compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/arti_windows_compiler.ps1

      - name: Build exact Arti identity candidate without running Tor
        shell: bash
        env:
          PULQVA_ARTI_PLATFORM: ${{ matrix.platform }}
          PULQVA_ARTI_EXECUTABLE: ${{ matrix.executable }}
          PULQVA_ARTI_FEATURE_ARGS: ${{ matrix.feature_args }}
        run: |
          set -euo pipefail

          ARTI_VERSION="$(tr -d '\r\n' < sidecars/arti/VERSION)"
          test "$ARTI_VERSION" = "2.6.0"

          INSTALL_ROOT="$RUNNER_TEMP/pulqva-arti-root"
          TARGET_ROOT="$RUNNER_TEMP/pulqva-arti-target"
          rm -rf "$INSTALL_ROOT" "$TARGET_ROOT"

          FEATURE_ARGS=()
          if [ -n "$PULQVA_ARTI_FEATURE_ARGS" ]; then
            FEATURE_ARGS=($PULQVA_ARTI_FEATURE_ARGS)
          fi

          if [ "$RUNNER_OS" = "Windows" ]; then
            RUST_SYSROOT="$(rustc +1.91.0 --print sysroot | tr -d '\r')"
            RUST_LLD_UNIX="$(cygpath -u "$RUST_SYSROOT")/lib/rustlib/x86_64-pc-windows-msvc/bin/rust-lld.exe"
            test -f "$RUST_LLD_UNIX"
            RUST_LLD_NATIVE="$(cygpath -w "$RUST_LLD_UNIX")"
            export CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER="$RUST_LLD_NATIVE"
            # Diagnostic map only; the existing full executable hash gate stays mandatory.
            export RUSTFLAGS="-C linker-flavor=lld-link -C link-arg=/Brepro -C link-arg=/DEBUG:NONE -C link-arg=/MAP:$(cygpath -m "$RUNNER_TEMP")/arti-link.map"
            LINKER_SHA256="$(sha256sum "$RUST_LLD_UNIX" | awk '{print $1}')"
            echo "PULQVA_ARTI_LINKER_SHA256=$LINKER_SHA256" >> "$GITHUB_ENV"
            echo "PULQVA_ARTI_RUSTFLAGS=$RUSTFLAGS" >> "$GITHUB_ENV"
            echo "PULQVA_ARTI_WINDOWS_LINKER=rust-lld rust_toolchain=1.91.0 linker=$RUST_LLD_NATIVE"
          fi

          CARGO_INCREMENTAL=0           cargo +1.91.0 install arti             --version "$ARTI_VERSION"             --locked             "${FEATURE_ARGS[@]}"             --root "$INSTALL_ROOT"             --target-dir "$TARGET_ROOT"

          ARTI_BIN="$INSTALL_ROOT/bin/$PULQVA_ARTI_EXECUTABLE"
          test -f "$ARTI_BIN"

          echo "PULQVA_ARTI_BIN=$ARTI_BIN" >> "$GITHUB_ENV"
          echo "PULQVA_ARTI_VERSION=$ARTI_VERSION" >> "$GITHUB_ENV"

      - name: Inventory Windows native build inputs
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/arti_windows_inputs.ps1

      - name: Preserve Windows linker and input diagnostics
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: arti-windows-build-diagnostics
          path: |
            ${{ runner.temp }}/arti-link.map
            ${{ runner.temp }}/arti-native-inputs.json
            ${{ runner.temp }}/arti-selected-compiler.json
            ${{ runner.temp }}/pulqva-arti-target/release/build/liblzma-sys-*/output
          if-no-files-found: error
          retention-days: 30

      - name: Verify Arti binary and proxy CLI without bootstrapping
        shell: bash
        run: |
          set -euo pipefail
          VERSION_OUTPUT="$("$PULQVA_ARTI_BIN" --version)"
          echo "$VERSION_OUTPUT"
          echo "$VERSION_OUTPUT" | grep -F "$PULQVA_ARTI_VERSION"
          "$PULQVA_ARTI_BIN" help proxy > "$RUNNER_TEMP/arti-proxy-help.txt"
          grep -i "proxy" "$RUNNER_TEMP/arti-proxy-help.txt"

      - name: Verify Windows release has no CodeView identity
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          python - "$(cygpath -w "$PULQVA_ARTI_BIN")" <<'PY'
          import struct
          import sys
          from pathlib import Path

          data = Path(sys.argv[1]).read_bytes()
          pe = struct.unpack_from("<I", data, 0x3c)[0]
          assert data[pe:pe + 4] == b"PE\0\0", "Invalid PE signature"
          count = struct.unpack_from("<H", data, pe + 6)[0]
          optional_size = struct.unpack_from("<H", data, pe + 20)[0]
          optional = pe + 24
          assert struct.unpack_from("<H", data, optional)[0] == 0x20b, "Expected PE32+"
          rva, size = struct.unpack_from("<II", data, optional + 112 + 6 * 8)
          assert rva and size and size % 28 == 0, "Missing/invalid PE debug directory"
          table = optional + optional_size
          debug_offset = None
          for index in range(count):
              section = table + index * 40
              _, base, raw_size, raw_offset = struct.unpack_from("<IIII", data, section + 8)
              if base <= rva and rva + size <= base + raw_size:
                  debug_offset = raw_offset + rva - base
                  break
          assert debug_offset is not None, "PE debug directory outside raw sections"
          assert debug_offset + size <= len(data), "Truncated PE debug directory"
          types = [
              struct.unpack_from("<I", data, offset + 12)[0]
              for offset in range(debug_offset, debug_offset + size, 28)
          ]
          assert 2 not in types, "Unexpected CodeView/PDB identity: /DEBUG:NONE ineffective"
          assert 16 in types, "Missing reproducible-build marker: /Brepro ineffective"
          print("PULQVA_ARTI_PE_METADATA codeview=false reproducible_marker=true")
          PY

      - name: Emit exact packaged-executable identity candidate
        shell: bash
        env:
          PULQVA_ARTI_PLATFORM: ${{ matrix.platform }}
          PULQVA_ARTI_EXECUTABLE: ${{ matrix.executable }}
          PULQVA_ARTI_FEATURE_ARGS: ${{ matrix.feature_args }}
        run: |
          set -euo pipefail

          if [ "$RUNNER_OS" = "Windows" ]; then
            SHA256="$(powershell.exe -NoProfile -Command "(Get-FileHash -Algorithm SHA256 -LiteralPath '$PULQVA_ARTI_BIN').Hash.ToLowerInvariant()" | tr -d '\r\n')"
          else
            SHA256="$(sha256sum "$PULQVA_ARTI_BIN" | awk '{print $1}')"
          fi

          test "${#SHA256}" -eq 64
          echo "$SHA256" | grep -Eq '^[0-9a-f]{64}$'

          BYTE_SIZE="$(wc -c < "$PULQVA_ARTI_BIN" | tr -d '[:space:]')"
          test "$BYTE_SIZE" -gt 0

          IDENTITY_ASSET="$PULQVA_ARTI_PLATFORM/$PULQVA_ARTI_EXECUTABLE"
          MATCH_COUNT="$(awk -v asset="$IDENTITY_ASSET" '$2 == asset { count++ } END { print count + 0 }' sidecars/arti/SHA256SUMS)"
          test "$MATCH_COUNT" -eq 1
          EXPECTED_SHA256="$(awk -v asset="$IDENTITY_ASSET" '$2 == asset { print $1 }' sidecars/arti/SHA256SUMS)"
          test "${#EXPECTED_SHA256}" -eq 64
          echo "$EXPECTED_SHA256" | grep -Eq '^[0-9a-f]{64}$'

          RECEIPT="$RUNNER_TEMP/arti-identity-${PULQVA_ARTI_PLATFORM}.txt"
          {
            echo "platform=$PULQVA_ARTI_PLATFORM"
            echo "version=$PULQVA_ARTI_VERSION"
            echo "executable=$PULQVA_ARTI_EXECUTABLE"
            echo "sha256=$SHA256"
            echo "expected_sha256=$EXPECTED_SHA256"
            echo "byte_size=$BYTE_SIZE"
            echo "rust_toolchain=1.91.0"
            echo "cargo_locked=true"
            echo "feature_args=$PULQVA_ARTI_FEATURE_ARGS"
            if [ "$RUNNER_OS" = "Windows" ]; then
              echo "linker=rust-lld"
              echo "linker_sha256=$PULQVA_ARTI_LINKER_SHA256"
              echo "rustflags=$PULQVA_ARTI_RUSTFLAGS"
              echo "codeview_identity=false"
            fi
          } > "$RECEIPT"

          cat "$RECEIPT"
          echo "PULQVA_ARTI_IDENTITY_COMPARE platform=$PULQVA_ARTI_PLATFORM actual_sha256=$SHA256 expected_sha256=$EXPECTED_SHA256 byte_size=$BYTE_SIZE"
          echo "PULQVA_ARTI_IDENTITY platform=$PULQVA_ARTI_PLATFORM version=$PULQVA_ARTI_VERSION executable=$PULQVA_ARTI_EXECUTABLE sha256=$SHA256 byte_size=$BYTE_SIZE"
          test "$SHA256" = "$EXPECTED_SHA256"

      - name: Capture exact built Arti artifact for immutable-source recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arti-identity-candidate-${{ matrix.platform }}
          path: |
            ${{ env.PULQVA_ARTI_BIN }}
            ${{ runner.temp }}/arti-identity-${{ matrix.platform }}.txt
          if-no-files-found: error
          retention-days: 30
