name: rust-check

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate comparison method before native or live work
        run: python3 tools/ci/test_matrix_receipt.py "$RUNNER_TEMP/pulqva-method/matrix_receipt.json"

      - name: Retain method preflight (not product acceptance)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulqva-method-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pulqva-method/
          if-no-files-found: error
          retention-days: 90

      - name: Verify media positive admission and bounded capture (synthetic)
        env:
          PULQVA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/ci/test_media_evidence.py "$RUNNER_TEMP/pulqva-media-controls"

      - name: Retain media capture control matrix (not live Tor)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulqva-media-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pulqva-media-controls/
          if-no-files-found: error
          retention-days: 90

      - name: Verify automatic versus live trigger containment
        env:
          PULQVA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/ci/test_legacy_live_guard.py "$RUNNER_TEMP/pulqva-live-trigger-contract"

      - name: Retain trigger-containment matrix (not live evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulqva-live-trigger-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pulqva-live-trigger-contract/
          if-no-files-found: error
          retention-days: 90

      - name: Verify native probe admission (synthetic; no Rust or Tor)
        run: python3 -m unittest discover -s tools/ci -p "test_readiness_contract_matrix.py" -v

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.91.0 --profile minimal
          rustup default 1.91.0

      - name: Verify pinned toolchain
        run: |
          test "$(rustc --version | awk '{print $2}')" = "1.91.0"
          test "$(cargo --version | awk '{print $2}')" = "1.91.0"

      - name: Test workspace
        run: cargo test --workspace --locked

      - name: Capture readiness diagnostics native contract matrix
        shell: bash
        env:
          PULQVA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/ci/readiness_contract_matrix.py "$RUNNER_TEMP/pulqva-readiness-contract"

      - name: Retain readiness diagnostics native contract
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulqva-readiness-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pulqva-readiness-contract/
          if-no-files-found: error
          retention-days: 90
