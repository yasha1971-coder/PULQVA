name: continuity-guard

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: write

jobs:
  continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate repository continuity state
        run: python3 scripts/continuity_guard.py

      - name: Evidence-boundary codec contract matrix (no model or network)
        run: python3 tools/ci/test_matrix_receipt.py "$RUNNER_TEMP/pulqva-recovery/g2a/matrix_receipt.json"

      - name: Recovery contract probes
        run: python3 scripts/test_recovery_guard.py "$RUNNER_TEMP/pulqva-recovery/matrix_receipt.json"

      - name: Verify sealed continuation and retained evidence
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PULQVA_ADMITTED_CHECKOUT: ${{ github.sha }}
        run: |
          set -euo pipefail
          export GIT_NO_REPLACE_OBJECTS=1 GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null
          test "$(git rev-parse HEAD)" = "$PULQVA_ADMITTED_CHECKOUT"
          trust="$(mktemp -d "$RUNNER_TEMP/continuity-history.XXXXXXXX")"
          git -c protocol.file.allow=always clone --no-local --no-checkout . "$trust/original"
          git -C "$trust/original" checkout --detach df5ac954485920c49e422fdb1eb5e9d3dd43c648
          git -c protocol.file.allow=always clone --no-local --no-checkout . "$trust/transition"
          git -C "$trust/transition" checkout --detach 3ca7a85ef5de3f9108cc3213da173a6f65356c87
          python3 "$trust/original/scripts/recovery_guard.py"
          python3 "$trust/transition/scripts/recovery_guard.py"
          python3 -B scripts/recovery_handoff_v2.py \
            --root "$GITHUB_WORKSPACE" --expected-head "$PULQVA_ADMITTED_CHECKOUT" \
            --trusted-root "$trust/original" --transition-root "$trust/transition" \
            > "$RUNNER_TEMP/pulqva-recovery/current-handoff.json"

      - name: Protect frozen kernel after v1 tag exists
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse "refs/tags/kernel-v1.0.0" >/dev/null 2>&1; then
            if ! git diff --quiet "kernel-v1.0.0" -- kernel/; then
              echo "Kernel files differ from frozen kernel-v1.0.0."
              echo "Normal feature work must be additive outside kernel/."
              exit 1
            fi
          else
            echo "kernel-v1.0.0 tag not present yet; bootstrap phase."
          fi

      - name: Export source backup and verify offline restore
        run: python3 scripts/recovery_backup.py "$RUNNER_TEMP/pulqva-recovery"

      - name: Retain recovery package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulqva-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pulqva-recovery/
          if-no-files-found: error
          retention-days: 90

      - name: Freeze kernel v1 after T001
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse "refs/tags/kernel-v1.0.0" >/dev/null 2>&1; then
            echo "kernel-v1.0.0 already exists."
            exit 0
          fi

          python3 - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path("PROJECT_STATE.json").read_text())
          if state.get("last_completed_task") != "T001":
              raise SystemExit("T001 not complete; kernel tag will not be created")
          if state.get("kernel_version") != "1.0.0":
              raise SystemExit("unexpected kernel version")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a kernel-v1.0.0 "$GITHUB_SHA" -m "PULQVA Kernel v1.0.0"
          git push origin kernel-v1.0.0
