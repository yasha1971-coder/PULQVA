name: tor-readiness-check
run-name: "Contracts only; live NOT TESTED (${{ github.event_name }})"

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admission:
    name: Live admission (NOT TESTED)
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      admitted: ${{ steps.admission.outputs.admitted }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Refuse unadmitted legacy live execution
        id: admission
        env:
          PULQVA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/ci/legacy_live_guard.py tor-readiness-check "$RUNNER_TEMP/live-admission"
      - name: Retain explicit live scope (not matrix evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-admission-tor-readiness-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/live-admission/live-status.json
          if-no-files-found: error
          retention-days: 30

  contracts:
    name: Deterministic contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.91.0 --profile minimal
      - name: Run existing deterministic contracts (no live Tor)
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.91.0 test --locked -p pulqva-privacy --lib arti_readiness

  readiness:
    needs: [admission, contracts]
    if: ${{ github.event_name == 'workflow_dispatch' && needs.admission.outputs.admitted == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.91.0 --profile minimal
          rustup default 1.91.0

      - name: Build exact pinned Arti sidecar
        shell: bash
        run: |
          set -euo pipefail
          ARTI_VERSION="$(tr -d '\r\n' < sidecars/arti/VERSION)"
          test "$ARTI_VERSION" = "2.6.0"

          EXTRA_FEATURES=()
          if [ "$RUNNER_OS" = "Windows" ]; then
            EXTRA_FEATURES=(--features static-sqlite)
          fi

          cargo +1.91.0 install arti \
            --version "$ARTI_VERSION" \
            --locked \
            "${EXTRA_FEATURES[@]}" \
            --root "$RUNNER_TEMP/arti-root"

      - name: Verify bounded fail-closed Tor readiness
        shell: bash
        run: |
          set -euo pipefail
          ARTI_BIN="$RUNNER_TEMP/arti-root/bin/arti"
          if [ "$RUNNER_OS" = "Windows" ]; then
            ARTI_BIN="${ARTI_BIN}.exe"
          fi

          test -f "$ARTI_BIN"

          OUTPUT="$(cargo +1.91.0 run \
            --quiet \
            --locked \
            -p pulqva-privacy \
            --example real_arti_readiness \
            -- "$ARTI_BIN")"
          echo "$OUTPUT"

          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "$OUTPUT" | grep -E 'PULQVA_TOR_(READY|WINDOWS_FAIL_CLOSED)_OK'
          else
            echo "$OUTPUT" | grep -F 'PULQVA_TOR_READY_OK'
          fi
