name: recovery-handoff-v2-contract
on:
  pull_request:
    paths:
      - "scripts/recovery_handoff_v2.py"
      - "scripts/test_recovery_handoff_v2.py"
      - ".github/workflows/recovery-handoff-v2-contract.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compile Python sources
        run: python3 -B -c "import ast, pathlib; [ast.parse(pathlib.Path(p).read_text()) for p in ['scripts/recovery_handoff_v2.py','scripts/test_recovery_handoff_v2.py']]"
      - name: Run original-history handoff contracts with durable evidence
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B scripts/test_recovery_handoff_v2.py --matrix "$RUNNER_TEMP/handoff-v2-evidence"
      - name: Validate actual checkout against original and reviewed native checkpoints
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PULQVA_ADMITTED_CHECKOUT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          export GIT_NO_REPLACE_OBJECTS=1 GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null
          test "$(git rev-parse HEAD)" = "$PULQVA_ADMITTED_CHECKOUT"
          trust="$(mktemp -d "$RUNNER_TEMP/handoff-history.XXXXXXXX")"
          git -c protocol.file.allow=always clone --no-local --no-checkout . "$trust/original"
          git -C "$trust/original" checkout --detach df5ac954485920c49e422fdb1eb5e9d3dd43c648
          git -c protocol.file.allow=always clone --no-local --no-checkout . "$trust/transition"
          git -C "$trust/transition" checkout --detach 3ca7a85ef5de3f9108cc3213da173a6f65356c87
          python3 -B scripts/recovery_handoff_v2.py \
            --root "$GITHUB_WORKSPACE" --expected-head "$PULQVA_ADMITTED_CHECKOUT" \
            --trusted-root "$trust/original" --transition-root "$trust/transition" \
            > "$RUNNER_TEMP/handoff-v2-evidence/current-handoff.json"
      - name: Retain bounded source-continuity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: handoff-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/handoff-v2-evidence/*.json
            ${{ runner.temp }}/handoff-v2-evidence/journal.jsonl
            ${{ runner.temp }}/handoff-v2-evidence/HV2-*/*.json
            ${{ runner.temp }}/handoff-v2-evidence/HV2-*/*.txt
            ${{ runner.temp }}/handoff-v2-evidence/HV2-*/*.patch
          if-no-files-found: error
          retention-days: 90
