name: recovery-handoff-v2-contract
on:
  pull_request:
    paths:
      - "scripts/recovery_handoff_v2.py"
      - "scripts/test_recovery_handoff_v2.py"
      - ".github/workflows/recovery-handoff-v2-contract.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python sources
        run: python3 -m py_compile scripts/recovery_handoff_v2.py scripts/test_recovery_handoff_v2.py
      - name: Run exact negative contract matrix
        run: python3 -m unittest discover -s scripts -p test_recovery_handoff_v2.py -v
