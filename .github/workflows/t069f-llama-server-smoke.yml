name: t069f-llama-server-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/T069-intent-contract
      - name: Build pinned llama-server
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama.cpp"
          git -C "$RUNNER_TEMP/llama.cpp" fetch --depth=1 origin tag v0.4.1
          git -C "$RUNNER_TEMP/llama.cpp" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/llama.cpp" rev-parse HEAD)" = b29c606e28a01b1bc8c1351026a0fa6e616bf6c4
          cmake -S "$RUNNER_TEMP/llama.cpp" -B "$RUNNER_TEMP/build" -DCMAKE_BUILD_TYPE=Release -DGGML_CUDA=OFF -DGGML_VULKAN=OFF -DGGML_METAL=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=ON
          cmake --build "$RUNNER_TEMP/build" --target llama-server --parallel 2
      - name: Fetch authenticated Qwen3-4B
        shell: bash
        run: |
          set -euo pipefail
          model="$RUNNER_TEMP/Qwen3-4B-Q4_K_M.gguf"
          curl --fail --location --retry 3 -o "$model" "https://huggingface.co/Qwen/Qwen3-4B-GGUF/resolve/bc640142c66e1fdd12af0bd68f40445458f3869b/Qwen3-4B-Q4_K_M.gguf?download=true"
          test "$(sha256sum "$model" | awk '{print $1}')" = 7485fe6f11af29433bc51cab58009521f205840f5b4ae3a32fa7f92e8534fdf5
      - name: Build T069-F smoke driver
        shell: bash
        run: cargo build --locked -p pulqva-intent-server
      - name: Run server smoke contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          echo "T069F_SERVER_BINARY=$RUNNER_TEMP/build/bin/llama-server" > "$RUNNER_TEMP/evidence/provenance.txt"
          echo "T069F_MODEL_SHA256=7485fe6f11af29433bc51cab58009521f205840f5b4ae3a32fa7f92e8534fdf5" >> "$RUNNER_TEMP/evidence/provenance.txt"
          echo "T069F_FEATURE_HEAD=$(git rev-parse HEAD)" >> "$RUNNER_TEMP/evidence/provenance.txt"
          cargo test --locked -p pulqva-intent-server --test lifecycle -- --nocapture | tee "$RUNNER_TEMP/evidence/deterministic-lifecycle.txt"
          cargo run --quiet --locked -p pulqva-intent-server --bin real_server_smoke -- \
            "$RUNNER_TEMP/build/bin/llama-server" \
            "$RUNNER_TEMP/Qwen3-4B-Q4_K_M.gguf" \
            "sidecars/llama.cpp/intent.schema.json" \
            "$RUNNER_TEMP/evidence/receipt.json" \
            19081
      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: t069f-server-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 7
