name: t069e-matched-cd
on:
  pull_request:
    paths:
      - 'eval/intent/**'
      - '.github/workflows/t069e-matched-cd.yml'
permissions:
  contents: read
jobs:
  matched:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - candidate: qwen3-4b
            repo: Qwen/Qwen3-4B-GGUF
            revision: bc640142c66e1fdd12af0bd68f40445458f3869b
            file: Qwen3-4B-Q4_K_M.gguf
            sha256: 7485fe6f11af29433bc51cab58009521f205840f5b4ae3a32fa7f92e8534fdf5
          - candidate: ministral3-3b
            repo: mistralai/Ministral-3-3B-Instruct-2512-GGUF
            revision: fc774f009f0c62a186f48e870fd6295b36f63779
            file: Ministral-3-3B-Instruct-2512-Q4_K_M.gguf
            sha256: 9ed150d4367e68df0ac8e1540f6ddc65b42d0ee26378329d1ecbca60f93fc5f8
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned llama.cpp
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama.cpp"
          git -C "$RUNNER_TEMP/llama.cpp" fetch --depth=1 origin tag v0.4.1
          git -C "$RUNNER_TEMP/llama.cpp" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/llama.cpp" rev-parse HEAD)" = b29c606e28a01b1bc8c1351026a0fa6e616bf6c4
          cmake -S "$RUNNER_TEMP/llama.cpp" -B "$RUNNER_TEMP/llama-build" -DCMAKE_BUILD_TYPE=Release -DGGML_CUDA=OFF -DGGML_VULKAN=OFF -DGGML_METAL=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=ON -DBUILD_SHARED_LIBS=OFF -DGGML_BACKEND_DL=OFF -DLLAMA_OPENSSL=OFF
          cmake --build "$RUNNER_TEMP/llama-build" --target llama-cli --parallel 2
      - name: Fetch and authenticate model
        shell: bash
        run: |
          set -euo pipefail
          model="$RUNNER_TEMP/${{ matrix.file }}"
          curl --fail --location --retry 3 --retry-delay 2 -o "$model" "https://huggingface.co/${{ matrix.repo }}/resolve/${{ matrix.revision }}/${{ matrix.file }}?download=true"
          test "$(sha256sum "$model" | awk '{print $1}')" = ${{ matrix.sha256 }}
      - name: Prove architecture loads
        shell: bash
        run: timeout 90 "$RUNNER_TEMP/llama-build/bin/llama-cli" -m "$RUNNER_TEMP/${{ matrix.file }}" -p 'Reply OK' -n 2 --temp 0 --simple-io --single-turn > "$RUNNER_TEMP/load.txt"
      - name: Build authoritative Rust evaluator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/accept/src"
          printf '%s\n' '[package]' 'name="pulqva-t069e-seed-accept"' 'version="0.0.0"' 'edition="2024"' 'publish=false' '[dependencies]' 'pulqva-core={path="'"$GITHUB_WORKSPACE"'/crates/pulqva-core"}' 'pulqva-intent-json={path="'"$GITHUB_WORKSPACE"'/crates/pulqva-intent-json"}' '[workspace]' > "$RUNNER_TEMP/accept/Cargo.toml"
          cp eval/intent/seed_accept.rs "$RUNNER_TEMP/accept/src/main.rs"
          cargo build --quiet --manifest-path "$RUNNER_TEMP/accept/Cargo.toml"
      - name: Run matched candidate
        id: evaluate
        shell: bash
        run: |
          python3 eval/intent/run_candidate.py --candidate ${{ matrix.candidate }} --model "$RUNNER_TEMP/${{ matrix.file }}" --llama-cli "$RUNNER_TEMP/llama-build/bin/llama-cli" --accept "$RUNNER_TEMP/accept/target/debug/pulqva-t069e-seed-accept" --out "$RUNNER_TEMP/evidence-${{ matrix.candidate }}"
      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: t069e-${{ matrix.candidate }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence-${{ matrix.candidate }}/
          if-no-files-found: error
          retention-days: 7
