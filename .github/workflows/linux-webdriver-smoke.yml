name: Linux search diagnostic candidate
on:
  push:
    branches: [diag/linux-search-category-20261030]
permissions:
  contents: read
jobs:
  build-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare evidence
        run: mkdir -p evidence
      - name: Existing Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev pkg-config build-essential libssl-dev
          rustup toolchain install 1.92.0 --profile minimal
      - name: Same accepted Linux Arti binding and diagnostic tests
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,hashlib,json,subprocess
          p=pathlib.Path("sidecars/arti/SHA256SUMS");before=p.read_bytes()
          pin="5f579c2525ae911d2ce402595b83512c03f8f24f224d49b05dcdee927b28ec01"
          lines=before.decode().splitlines()
          assert sum(len(x.split())==2 and x.split()[1]=="linux-x86_64/arti" for x in lines)==1
          p.write_text("\n".join(pin+"  linux-x86_64/arti" if len(x.split())==2 and x.split()[1]=="linux-x86_64/arti" else x for x in lines)+"\n")
          pathlib.Path("evidence/input.json").write_text(json.dumps({"source_sha":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),"arti_sha256":pin,"overlay_before":hashlib.sha256(before).hexdigest(),"overlay_after":hashlib.sha256(p.read_bytes()).hexdigest(),"gui_run":False},indent=2))
          PY
          cargo +1.92.0 test --locked --manifest-path apps/pulqva-desktop/src-tauri/Cargo.toml tor_diagnostics -- --nocapture 2>&1 | tee evidence/tests.log
          cargo +1.92.0 build --release --locked --manifest-path apps/pulqva-desktop/src-tauri/Cargo.toml 2>&1 | tee evidence/build.log
          cp apps/pulqva-desktop/src-tauri/target/release/pulqva-desktop evidence/PULQVA-diagnostic
          sha256sum evidence/PULQVA-diagnostic > evidence/SHA256SUMS
          git diff --exit-code -- Cargo.lock apps/pulqva-desktop/src-tauri/Cargo.lock kernel PROJECT_STATE.json NEXT.md
          rustc +1.92.0 -Vv > evidence/rust.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-search-diagnostic-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
