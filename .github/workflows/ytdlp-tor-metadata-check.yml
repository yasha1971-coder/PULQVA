name: ytdlp-tor-metadata-check
run-name: "Contracts only; live NOT TESTED (${{ github.event_name }})"

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admission:
    name: Live admission (NOT TESTED)
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      admitted: ${{ steps.admission.outputs.admitted }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Refuse unadmitted legacy live execution
        id: admission
        env:
          PULQVA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/ci/legacy_live_guard.py ytdlp-tor-metadata-check "$RUNNER_TEMP/live-admission"
      - name: Retain explicit live scope (not matrix evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-admission-ytdlp-tor-metadata-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/live-admission/live-status.json
          if-no-files-found: error
          retention-days: 30

  contracts:
    name: Deterministic contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.91.0 --profile minimal
      - name: Run existing deterministic contracts (no live Tor)
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.91.0 test --locked -p pulqva-privacy --lib ytdlp_
          cargo +1.91.0 test --locked -p pulqva-privacy --example real_ytdlp_tor_metadata

  metadata:
    needs: [admission, contracts]
    if: ${{ github.event_name == 'workflow_dispatch' && needs.admission.outputs.admitted == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.91.0 --profile minimal
          rustup default 1.91.0

      - name: Build exact pinned Arti sidecar
        shell: bash
        run: |
          set -euo pipefail

          ARTI_VERSION="$(tr -d '\r\n' < sidecars/arti/VERSION)"
          test "$ARTI_VERSION" = "2.6.0"

          EXTRA_FEATURES=()
          if [ "$RUNNER_OS" = "Windows" ]; then
            EXTRA_FEATURES=(--features static-sqlite)
          fi

          cargo +1.91.0 install arti \
            --version "$ARTI_VERSION" \
            --locked \
            "${EXTRA_FEATURES[@]}" \
            --root "$RUNNER_TEMP/arti-root"

          ARTI_BIN="$RUNNER_TEMP/arti-root/bin/arti"
          if [ "$RUNNER_OS" = "Windows" ]; then
            ARTI_BIN="${ARTI_BIN}.exe"
          fi
          test -f "$ARTI_BIN"
          echo "ARTI_BIN=$ARTI_BIN" >> "$GITHUB_ENV"

      - name: Download and verify exact pinned yt-dlp sidecar
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(tr -d '\r\n' < sidecars/yt-dlp/VERSION)"
          test "$VERSION" = "2026.08.19"

          if [ "$RUNNER_OS" = "Windows" ]; then
            ASSET="yt-dlp.exe"
          else
            ASSET="yt-dlp_linux"
          fi

          EXPECTED="$(awk -v asset="$ASSET" '$2 == asset {print $1}' sidecars/yt-dlp/SHA256SUMS)"
          test -n "$EXPECTED"

          BIN="$RUNNER_TEMP/$ASSET"
          URL="https://github.com/yt-dlp/yt-dlp/releases/download/$VERSION/$ASSET"
          curl --fail --location --retry 3 --retry-delay 2 --output "$BIN" "$URL"

          if [ "$RUNNER_OS" = "Windows" ]; then
            ACTUAL="$(powershell.exe -NoProfile -Command "(Get-FileHash -Algorithm SHA256 -LiteralPath '$BIN').Hash.ToLowerInvariant()" | tr -d '\r\n')"
            EXEC_BIN="$(cygpath -u "$BIN")"
          else
            ACTUAL="$(sha256sum "$BIN" | awk '{print $1}')"
            chmod +x "$BIN"
            EXEC_BIN="$BIN"
          fi

          test "$ACTUAL" = "$EXPECTED"
          VERSION_OUTPUT="$("$EXEC_BIN" --version)"
          test "$VERSION_OUTPUT" = "$VERSION"

          echo "YTDLP_BIN=$EXEC_BIN" >> "$GITHUB_ENV"

      - name: Test native yt-dlp runtime paths and full launch vectors
        shell: bash
        run: cargo +1.91.0 test --locked -p pulqva-privacy --lib ytdlp_

      - name: Test bounded metadata diagnostics without network
        shell: bash
        run: cargo +1.91.0 test --locked -p pulqva-privacy --example real_ytdlp_tor_metadata

      - name: Prove bounded metadata-only yt-dlp request through Tor
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT="$(cargo +1.91.0 run \
            --quiet \
            --locked \
            -p pulqva-privacy \
            --example real_ytdlp_tor_metadata \
            -- "$ARTI_BIN" "$YTDLP_BIN" --diagnostics)"
          echo "$OUTPUT"

          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "$OUTPUT" | grep -E 'PULQVA_YTDLP_TOR_(METADATA|WINDOWS_FAIL_CLOSED)_OK'
          else
            echo "$OUTPUT" | grep -F 'PULQVA_YTDLP_TOR_METADATA_OK'
          fi
