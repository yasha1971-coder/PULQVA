[package]
name = "pulqva-discovery"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
pulqva-core = { path = "../pulqva-core" }
pulqva-privacy = { path = "../pulqva-privacy" }
# Reuse the already verified workspace graph; no upstream version upgrade.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

# T068-B0 candidate only; import Cargo's verified lock before shipping adoption.
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "socks"] }
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "=1.0.9"
tokio = { version = "=1.53.1", default-features = false, features = ["rt", "net", "time"] }

# C2 artifact identity: SHA-1 matches provider metadata; SHA-256 is local identity.
sha1 = "=0.11.0"
sha2 = "=0.11.0"
